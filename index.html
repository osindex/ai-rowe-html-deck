<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>从在场主义到价值主义 · 目录简报</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;900&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --shadow: 0 22px 50px rgba(20, 16, 12, .12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", sans-serif;
      overflow: hidden;
      background: #111;
    }
    h1, h2, h3, .serif { font-family: "Noto Serif SC", "Songti SC", serif; }
    h1 { font-size: clamp(40px, 5vw, 76px); line-height: 1.12; font-weight: 700; }
    h2 { font-size: clamp(28px, 3.4vw, 52px); line-height: 1.18; font-weight: 700; max-width: 16em; }
    .lead { font-size: clamp(17px, 1.55vw, 24px); line-height: 1.7; max-width: 42ch; color: var(--muted); }
    .quote { font-family: "Noto Serif SC", serif; font-size: clamp(24px, 2.6vw, 38px); line-height: 1.45; max-width: 16em; }

    .deck { position: relative; width: 100%; height: 100%; }
    .slide {
      position: absolute;
      inset: 0;
      display: none;
      padding: 7vh 7.5vw 11vh;
      color: var(--fg);
      background: var(--bg);
    }
    .slide.active { display: flex; flex-direction: column; animation: rise .42s ease; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }

    .kicker {
      color: var(--accent);
      letter-spacing: .22em;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .rule { width: 64px; height: 4px; background: var(--accent); margin: 22px 0; border: 0; }

    .theme-cover {
      --bg: #1b1410;
      --fg: #fff6ea;
      --muted: #d7c4ad;
      --accent: #ff6b3d;
      --card: #2a201a;
      --line: rgba(255, 180, 140, .2);
      background:
        linear-gradient(115deg, #2c1812 0%, transparent 46%),
        radial-gradient(900px 520px at 100% 0%, #ff7a3d33, transparent 50%),
        #1b1410;
    }
    .theme-toc {
      --bg: #f4efe6;
      --fg: #1c1915;
      --muted: #6d655b;
      --accent: #c23b22;
      --card: #fffdf8;
      --line: rgba(28, 25, 21, .08);
      background:
        radial-gradient(800px 400px at 0% 100%, #f3d7a855, transparent 55%),
        #f4efe6;
    }
    .theme-goal {
      --bg: #e8f3ee;
      --fg: #10241d;
      --muted: #4c6b60;
      --accent: #0b7a62;
      --card: #ffffff;
      --line: rgba(11, 122, 98, .12);
      background:
        radial-gradient(700px 420px at 100% 0%, #9ad7c440, transparent 50%),
        #e8f3ee;
    }
    .theme-pain {
      --bg: #2a1116;
      --fg: #ffe8e2;
      --muted: #e0b6ae;
      --accent: #ff7a59;
      --card: #3a1b21;
      --line: rgba(255, 140, 110, .18);
      background:
        radial-gradient(800px 480px at 0% 0%, #ff5a3a22, transparent 50%),
        #2a1116;
    }
    .theme-plan {
      --bg: #e8eefc;
      --fg: #141a2e;
      --muted: #55607c;
      --accent: #2450d6;
      --card: #ffffff;
      --line: rgba(36, 80, 214, .12);
      background:
        radial-gradient(720px 420px at 100% 100%, #7ea2ff33, transparent 50%),
        #e8eefc;
    }
    .theme-base {
      --bg: #101826;
      --fg: #eaf0ff;
      --muted: #9eafd0;
      --accent: #6ee0d0;
      --card: #182234;
      --line: rgba(110, 224, 208, .16);
      background:
        radial-gradient(820px 460px at 100% 0%, #2d6bff22, transparent 52%),
        #101826;
    }
    .theme-do {
      --bg: #f7f1d8;
      --fg: #231c08;
      --muted: #6d6238;
      --accent: #b8860b;
      --card: #fffbeb;
      --line: rgba(184, 134, 11, .16);
      background:
        radial-gradient(700px 400px at 0% 0%, #f0c14b33, transparent 50%),
        #f7f1d8;
    }
    .theme-act {
      --bg: #c23b22;
      --fg: #fff7f2;
      --muted: #ffd8cf;
      --accent: #ffd166;
      --card: #a8311c;
      --line: rgba(255, 230, 210, .2);
      background:
        radial-gradient(900px 500px at 100% 0%, #ff8a5b55, transparent 50%),
        #c23b22;
    }

    .grid { display: grid; gap: 18px; margin-top: 32px; }
    .cols-2 { grid-template-columns: 1.05fr .95fr; }
    .cols-3 { grid-template-columns: repeat(3, 1fr); }
    .cols-4 { grid-template-columns: repeat(4, 1fr); }
    .toc-grid { grid-template-columns: 1fr 1fr; gap: 18px; flex: 1; margin-top: 22px; }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 22px 20px;
      min-height: 148px;
      box-shadow: var(--shadow);
    }
    .card h3 { font-size: 20px; margin: 8px 0 8px; }
    .card p { color: var(--muted); font-size: 15px; line-height: 1.7; }
    .idx { color: var(--accent); font-size: 12px; letter-spacing: .16em; font-weight: 700; }

    .toc-card {
      cursor: pointer;
      position: relative;
      z-index: 7;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 26px;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .toc-card:hover { transform: translateY(-4px); }
    .toc-card .num {
      font-family: "Noto Serif SC", serif;
      font-size: clamp(42px, 5vw, 64px);
      line-height: 1;
      margin-bottom: 10px;
    }
    .toc-card h3 { font-size: clamp(28px, 3vw, 40px); margin: 0 0 8px; }
    .toc-c1 { background: #0b7a62; color: #e8fff6; --muted: #c6efe3; }
    .toc-c2 { background: #c23b22; color: #fff4ef; --muted: #ffd4c8; }
    .toc-c3 { background: #2450d6; color: #eef2ff; --muted: #c9d4ff; }
    .toc-c4 { background: #b8860b; color: #fff8e4; --muted: #ffe7a8; }
    .toc-card p { color: inherit; opacity: .86; font-size: 16px; }

    .meta { margin-top: auto; display: flex; gap: 24px; color: var(--muted); font-size: 14px; }
    .stat { font-family: "Noto Serif SC", serif; font-size: clamp(52px, 6vw, 84px); color: var(--accent); line-height: .9; }
    .stat span { font-size: .42em; }

    ul.clean { list-style: none; }
    ul.clean li {
      position: relative;
      padding-left: 20px;
      margin: 12px 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.65;
    }
    ul.clean li::before {
      content: "";
      position: absolute;
      left: 0; top: .72em;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    .rows { display: flex; flex-direction: column; gap: 12px; margin-top: 28px; }
    .row {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 18px;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 20px;
    }
    .row b { color: var(--accent); font-size: 28px; font-family: "Noto Serif SC", serif; }

    .chapter {
      justify-content: flex-end;
      padding-bottom: 14vh;
    }
    .chapter .big {
      font-family: "Noto Serif SC", serif;
      font-size: clamp(80px, 14vw, 180px);
      line-height: .85;
      opacity: .18;
      position: absolute;
      right: 6vw;
      top: 8vh;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
    .chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 13px;
      color: var(--fg);
      background: color-mix(in srgb, var(--card) 80%, transparent);
    }

    .bar {
      display: flex;
      height: 16px;
      border-radius: 99px;
      overflow: hidden;
      background: color-mix(in srgb, var(--fg) 8%, transparent);
      margin-top: 12px;
    }
    .bar i { display: block; height: 100%; }
    .w60 { width: 65%; background: #2450d6; }
    .w20 { width: 20%; background: #0b7a62; }
    .w15 { width: 15%; background: #b8860b; }

    .timeline { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 36px; }
    .phase {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 22px 20px;
      min-height: 220px;
    }

    .ico {
      width: 36px; height: 36px; border-radius: 10px;
      display: grid; place-items: center;
      background: color-mix(in srgb, var(--accent) 16%, var(--card));
      margin-bottom: 4px;
    }
    .ico svg { width: 20px; height: 20px; stroke: var(--accent); fill: none; stroke-width: 1.8; }

    .layers { display: grid; grid-template-columns: 1.4fr .8fr; gap: 18px; margin-top: 18px; flex: 1; min-height: 0; }
    .layer {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 14px;
      align-items: center;
      border-radius: 18px;
      padding: 14px 16px;
      color: #fff;
      margin-bottom: 10px;
    }
    .layer .mark {
      font-family: "Noto Serif SC", serif;
      font-size: 28px;
      line-height: 1;
    }
    .layer h3 { font-size: 20px; margin: 0 0 4px; color: #fff; }
    .layer p { color: rgba(255,255,255,.82); font-size: 13px; line-height: 1.55; margin: 0; }
    .layer .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .layer .tags span {
      background: rgba(255,255,255,.16);
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 12px;
    }
    .ly-goal { background: linear-gradient(90deg, #0b7a62, #14a384); }
    .ly-proc { background: linear-gradient(90deg, #2450d6, #4c78ee); }
    .ly-res  { background: linear-gradient(90deg, #b45309, #d97706); }
    .loop-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .loop-card q {
      font-family: "Noto Serif SC", serif;
      font-size: 18px;
      line-height: 1.5;
      quotes: none;
    }
    .drive {
      display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px;
    }
    .drive span {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 13px;
    }
    .drive b { color: var(--accent); }

    .stages { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 20px; }
    .stage {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 12px;
      min-height: 210px;
      position: relative;
    }
    .stage .n {
      font-family: "Noto Serif SC", serif;
      font-size: 26px;
      color: var(--accent);
      line-height: 1;
    }
    .stage h3 { font-size: 16px; margin: 8px 0 6px; }
    .stage p { font-size: 12px; color: var(--muted); line-height: 1.55; }
    .logic {
      display: flex; gap: 6px; flex-wrap: wrap; margin-top: 16px; font-size: 12px;
    }
    .logic i {
      font-style: normal;
      background: #231c08;
      color: #fff8e4;
      border-radius: 999px;
      padding: 5px 10px;
    }

    .war {
      display: grid;
      grid-template-columns: 56px 1.3fr .7fr;
      gap: 12px;
      margin-top: 14px;
      flex: 1;
      min-height: 0;
    }
    .war-nav {
      background: #0d1a33;
      border-radius: 16px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }
    .war-nav span {
      width: 100%;
      text-align: center;
      color: #9eb0d4;
      font-size: 10px;
      padding: 7px 0;
      border-radius: 8px;
    }
    .war-nav .on { background: #2450d6; color: #fff; }
    .war-main, .war-side {
      background: #f7f9ff;
      color: #152038;
      border-radius: 16px;
      padding: 12px;
      min-height: 0;
    }
    .war-head {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px; font-size: 12px; color: #5a6a88;
    }
    .enter {
      background: #2450d6; color: #fff; border: 0; border-radius: 8px;
      padding: 6px 10px; font-size: 12px;
    }
    .people {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    }
    .person {
      background: #fff;
      border: 1px solid #dce4f5;
      border-radius: 12px;
      padding: 8px 6px;
      text-align: center;
    }
    .av {
      width: 36px; height: 36px; border-radius: 50%;
      margin: 0 auto 6px; display: grid; place-items: center;
      color: #fff; font-size: 14px; font-weight: 700;
    }
    .person b { display: block; font-size: 12px; }
    .person small { color: #6b7a96; font-size: 10px; }
    .st { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; }
    .s-on { background: #16a34a; } .s-focus { background: #2450d6; }
    .s-away { background: #f59e0b; } .s-dnd { background: #7c3aed; }
    .feed { font-size: 12px; color: #33415f; display: flex; flex-direction: column; gap: 8px; }
    .feed li { list-style: none; background: #fff; border-radius: 10px; padding: 8px; border: 1px solid #dce4f5; }
    .eq {
      display: flex; align-items: center; gap: 14px; margin-top: 18px; flex-wrap: wrap;
    }
    .eq .box {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px 18px;
      font-family: "Noto Serif SC", serif;
      font-size: 22px;
    }
    .eq .x { color: var(--accent); font-size: 28px; font-weight: 700; }

    .tight { padding-top: 5vh; padding-bottom: 9vh; }
    .tight h2 { font-size: clamp(22px, 2.6vw, 36px); }
    .tight .layers, .tight .war, .tight .stages { margin-top: 12px; }
    .tight .layer { margin-bottom: 8px; padding: 12px 14px; }
    .stage { min-height: 188px; }

    @media (max-width: 1100px) {
      .layers, .war { grid-template-columns: 1fr; }
      .stages { grid-template-columns: 1fr 1fr; }
      .people { grid-template-columns: repeat(2, 1fr); }
    }

    .footer-ui, .progress, .hit { z-index: 5; }
    .footer-ui {
      position: fixed; left: 0; right: 0; bottom: 0; height: 48px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 7.5vw; font-size: 12px; letter-spacing: .08em;
      color: var(--foot, #8a8378); pointer-events: none;
    }
    .footer-ui .hint { opacity: .75; }
    .progress { position: fixed; left: 0; right: 0; top: 0; height: 4px; background: rgba(0,0,0,.08); z-index: 6; }
    .progress span { display: block; height: 100%; width: 0; background: #c23b22; }
    .hit { position: fixed; top: 0; bottom: 48px; width: 4.5vw; z-index: 4; cursor: pointer; }
    .hit.left { left: 0; } .hit.right { right: 0; }

    .notes {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      max-height: 42vh;
      overflow: auto;
      background: rgba(16, 14, 12, .94);
      color: #fff6ea;
      border-radius: 20px 20px 0 0;
      padding: 16px 7.5vw 64px;
      z-index: 8;
      transform: translateY(110%);
      transition: transform .28s ease;
      box-shadow: 0 -16px 40px rgba(0,0,0,.28);
    }
    .notes.show { transform: translateY(0); }
    .notes-handle {
      width: 48px; height: 4px; border-radius: 99px;
      background: #6b6256; margin: 0 auto 12px;
    }
    .notes h4 { color: #ffd166; font-size: 12px; letter-spacing: .16em; margin-bottom: 8px; }
    .notes p { color: #ead9c6; font-size: 16px; line-height: 1.75; max-width: 70ch; }

    .help, .overview {
      position: fixed; inset: auto 7vw 64px auto;
      width: min(560px, 42vw); max-height: 42vh; overflow: auto;
      background: rgba(20, 16, 12, .92); color: #fff6ea;
      border-radius: 16px; padding: 18px 20px; z-index: 8; display: none;
    }
    .help.show { display: block; }
    .help h4 { color: #ffd166; font-size: 12px; letter-spacing: .16em; margin-bottom: 8px; }
    .help p { color: #ead9c6; font-size: 14px; line-height: 1.7; }
    .help kbd {
      display: inline-block; min-width: 28px; text-align: center;
      border: 1px solid #5a5046; border-radius: 6px; padding: 1px 6px; margin-right: 8px; color: #ffd166;
    }
    .overview {
      inset: 6vh 6vw; width: auto; max-height: none; display: none;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; padding: 22px;
    }
    .overview.show { display: grid; }
    .thumb { border: 1px solid #4a433a; border-radius: 12px; padding: 14px; min-height: 100px; cursor: pointer; }
    .thumb.current { border-color: #ffd166; }
    .thumb b { display: block; font-size: 11px; color: #ffd166; margin-bottom: 6px; }
    .thumb span { font-size: 14px; }

    @media (max-width: 900px) {
      .cols-2, .cols-3, .cols-4, .toc-grid, .timeline, .row { grid-template-columns: 1fr; }
      .slide { padding: 8vh 6vw 12vh; }
      h2 { max-width: none; }
      .help { left: 5vw; right: 5vw; width: auto; }
      .chapter .big { font-size: 90px; }
    }
    @media print {
      body { overflow: auto; }
      .slide { position: relative; display: flex !important; page-break-after: always; height: 100vh; animation: none; }
      .footer-ui, .hit, .progress, .notes, .help, .overview { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="progress"><span id="bar"></span></div>
  <div class="deck" id="deck"></div>
  <div class="hit left" id="prevHit"></div>
  <div class="hit right" id="nextHit"></div>
  <div class="footer-ui">
    <span id="footLeft">目录 · 目标 / 痛点 / 方案 / 实施</span>
    <span class="hint">← → 翻页　↓ ↑ 注释</span>
    <span id="counter">1 / 22</span>
  </div>
  <aside class="notes" id="notes">
    <div class="notes-handle"></div>
    <h4>本页注释 · ↓ 打开　↑ 收起</h4>
    <p id="notesBody"></p>
  </aside>
  <aside class="help" id="help">
    <h4>快捷键</h4>
    <p><kbd>→</kbd>下一页　<kbd>←</kbd>上一页</p>
    <p><kbd>↓</kbd>显示注释　<kbd>↑</kbd>收起注释</p>
    <p><kbd>O</kbd>总览　<kbd>F</kbd>全屏　<kbd>?</kbd>本说明</p>
    <p>左右滑动翻页，上下滑动开关注释</p>
  </aside>
  <aside class="overview" id="overview"></aside>

  <script>
    const slides = [
      {
        title: "封面",
        chapter: "封面",
        theme: "theme-cover",
        notes: "各位好。今天按四个大目录讲：目标、痛点、方案、实施。核心一句话——从全员坐班打卡，转向结果导向的远程工作，不是换办公地点，而是从在场主义转向价值主义。",
        html: `
          <div class="kicker">12 min · Briefing</div>
          <h1>从「在场主义」<br>到「价值主义」</h1>
          <hr class="rule" />
          <p class="lead">AI 浪潮下的组织变革：废除坐班打卡，建成以结果为导向的远程工作体系。</p>
          <div class="chips">
            <span class="chip">01 目标</span><span class="chip">02 痛点</span>
            <span class="chip">03 方案</span><span class="chip">04 实施</span>
          </div>
          <div class="meta">
            <span>2026年8月18日</span>
            <span>CEO / CHRO / 业务负责人</span>
          </div>`
      },
      {
        title: "目录",
        chapter: "目录",
        theme: "theme-toc",
        notes: "目录就四块。目标：我们要建成什么样的组织。痛点：旧模式为什么量不出价值。方案：领导力、组织、绩效、文化和技术怎么改。实施：试点路径、别人怎么做、坑怎么躲。点卡片可以直接跳到对应章节。",
        html: `
          <div class="kicker">Contents</div>
          <h2>今天只讲四件事</h2>
          <div class="grid toc-grid">
            <article class="card toc-card toc-c1" data-jump="2">
              <div>
                <div class="num">01</div>
